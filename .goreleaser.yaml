version: 2

project_name: noetive-mcp

before:
  hooks:
    - go mod tidy

builds:
  - id: noetive-mcp
    main: ./cmd/noetive-mcp
    binary: noetive-mcp
    env:
      - CGO_ENABLED=0
    # Reproducible builds: the timestamp and paths are the two inputs that
    # otherwise differ between machines, which would make the published
    # provenance impossible for anyone to reproduce independently.
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      # No Windows arm64 npm package is published, so building one would ship an
      # artifact nothing resolves.
      - goos: windows
        goarch: arm64

archives:
  - id: noetive-mcp
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "noetive-mcp_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

# The npm fallback downloads a bare binary rather than an archive, so each one is
# published under the platform key the wrapper computes from process.platform
# and process.arch. Keep these names in step with PLATFORM_PACKAGES in
# installer/src/resolveBinary.ts.
#
# The globs stop at the GOARCH and wildcard the rest: goreleaser appends a
# microarchitecture level to the output directory — amd64 as _v1, arm64 as _v8.0
# — and it has changed which architectures get one. Hard-coding the directory
# name is what broke here: arm64 acquired a suffix these globs did not have, and
# the release failed at the checksum stage with the binaries already built.
release:
  # Without this, any failure after the upload step burns the version number:
  # the assets are already on the release, goreleaser refuses to overwrite them,
  # and the only way forward is a new tag. That is a harsh penalty for a
  # pipeline whose later stages talk to npm, ghcr and a registry — the stages
  # most likely to fail for reasons that have nothing to do with the build.
  #
  # Safe because the build is reproducible: -trimpath, CGO_ENABLED=0, a
  # commit-derived mod_timestamp and a toolchain pinned by go.mod mean a re-run
  # of the same tag produces byte-identical binaries. What gets replaced is the
  # same bytes, so a consumer who downloaded before the re-run and one who
  # downloads after get the same artifact.
  replace_existing_artifacts: true

  # A prerelease tag must not become the repository's "Latest release": that is
  # what installer/postinstall.js's fallback download resolves against, and what
  # anyone landing on the releases page reads as current. `auto` marks it from
  # the tag, matching the npm dist-tag the release workflow derives the same way.
  prerelease: auto

  extra_files:
    - glob: dist/noetive-mcp_darwin_arm64*/noetive-mcp
      name_template: noetive-mcp-darwin-arm64
    - glob: dist/noetive-mcp_darwin_amd64*/noetive-mcp
      name_template: noetive-mcp-darwin-x64
    - glob: dist/noetive-mcp_linux_arm64*/noetive-mcp
      name_template: noetive-mcp-linux-arm64
    - glob: dist/noetive-mcp_linux_amd64*/noetive-mcp
      name_template: noetive-mcp-linux-x64
    - glob: dist/noetive-mcp_windows_amd64*/noetive-mcp.exe
      name_template: noetive-mcp-win32-x64.exe

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: dist/noetive-mcp_darwin_arm64*/noetive-mcp
      name_template: noetive-mcp-darwin-arm64
    - glob: dist/noetive-mcp_darwin_amd64*/noetive-mcp
      name_template: noetive-mcp-darwin-x64
    - glob: dist/noetive-mcp_linux_arm64*/noetive-mcp
      name_template: noetive-mcp-linux-arm64
    - glob: dist/noetive-mcp_linux_amd64*/noetive-mcp
      name_template: noetive-mcp-linux-x64
    - glob: dist/noetive-mcp_windows_amd64*/noetive-mcp.exe
      name_template: noetive-mcp-win32-x64.exe

# Keyless signing: the identity is the GitHub Actions workflow itself, recorded
# in the public transparency log, so a consumer can verify who built an artifact
# without anyone holding a private key that could leak.
signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum
    output: true

changelog:
  use: github
  sort: asc
  # Scoped forms too: dependabot writes `chore(deps): bump ...`, which a bare
  # `^chore:` does not match, and a scope is the normal way to say which part of
  # the tree a docs change touched. The changelog is read by someone deciding
  # whether to upgrade an npm package; nothing excluded here changes what that
  # package does.
  filters:
    exclude:
      - '^docs(\(.+\))?:'
      - '^test(\(.+\))?:'
      - '^chore(\(.+\))?:'
      - '^build(\(.+\))?:'
      - '^ci(\(.+\))?:'
      - '^style(\(.+\))?:'
      - '^refactor(\(.+\))?:'
