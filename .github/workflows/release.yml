name: release

on:
  push:
    tags: ["v*"]

# Read by default; the one job that needs to write says so itself. Inverted
# deliberately — with the grants at the top, the next job added inherits write
# on repository contents without anyone deciding it should.
permissions:
  contents: read

# Workflow-wide, not per-tag: two tags in flight at once race on npm's latest
# dist-tag, and the loser silently becomes what `npx` installs.
#
# cancel-in-progress: false keeps a *running* release from being killed between
# the platform packages and the wrapper, which would leave a published version
# resolving to nothing. It is not a promise that nothing is ever cancelled:
# GitHub keeps one pending run per group, so a third tag pushed while two are
# outstanding cancels the one still waiting. Push release tags one at a time,
# and re-run from the Actions tab if one is cancelled while queued.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # goreleaser creates the release and uploads to it.
      contents: write
      # Both needed for keyless signing and build provenance: the workflow proves
      # its own identity with an OIDC token instead of holding a signing key.
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      npm_tag: ${{ steps.version.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      # The tag is the only version input: ldflags, both npm manifests and
      # server.json are all stamped from it. A malformed tag, or one that
      # disagrees with the packaging manifest, has to stop here — a GitHub
      # Release cannot be unpublished cleanly and an npm version cannot be
      # reused at all.
      #
      # tools/manifest.yaml is checked rather than stamped: the Claude plugin and
      # the Kiro Power are served out of the repository itself, so their version
      # is whatever is committed, and a stamp applied in CI is read by nobody.
      #
      # The pattern matches scripts/stamp-version.js exactly, so the two cannot
      # disagree about what a valid tag is.
      - id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z_.]+)?$' || {
            echo "tag ${GITHUB_REF_NAME} is not a semver release tag" >&2
            exit 1
          }
          declared=$(sed -n 's/^version: *//p' tools/manifest.yaml)
          [ "$declared" = "$version" ] || {
            echo "tools/manifest.yaml declares '${declared}' but the tag is '${version}'." >&2
            echo "Bump the manifest, run make emit, commit, then tag." >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # npm assigns the `latest` dist-tag to any publish that does not name
          # one; it infers nothing from the version string. Every install path
          # advertised anywhere is a bare `npx @noetive/mcp-server`, so without
          # this a prerelease becomes what every user gets.
          if [ "$version" = "${version%%-*}" ]; then
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "npm_tag=next" >> "$GITHUB_OUTPUT"
          fi

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          # Pinned like golangci-lint in ci.yml: with `latest`, the tool that
          # produces the signed artifacts can change between two runs of the same
          # tag, and a release nobody can reproduce is not a release.
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Attests that these exact bytes came from this workflow at this commit,
      # which is what lets a consumer distinguish a real release from a
      # look-alike uploaded by someone with repository write access.
      #
      # The build output, not the release asset names: goreleaser renames the
      # bare binaries on upload, and attestation is keyed by digest, so attesting
      # what is on disk covers the asset installer/postinstall.js downloads.
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            dist/*/noetive-mcp
            dist/*/noetive-mcp.exe
            dist/*.tar.gz
            dist/*.zip

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: binaries
          path: dist/

  npm:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: installer/package-lock.json

      # Trusted publishing needs npm 11.5.1 or later and Node 22.14 or later.
      # Node 22 satisfies the runtime but still bundles npm 10, which does not
      # know how to exchange an OIDC token at all — it would fall silently
      # through to token auth and the publish would look like it simply needed a
      # secret. Pinned rather than @latest so a bad npm release cannot break a
      # release of this.
      - run: npm install -g npm@11.6.2

      # Before anything is built. Without it the job installs, builds, stamps
      # and packs five 8 MB binaries before npm reports ENEEDAUTH — by which
      # point the GitHub Release already exists, so a missing repository secret
      # reads as a release that half-worked.
      #
      # whoami rather than a non-empty check: an expired or revoked token is
      # also a string, and it fails at exactly the same late point.
      # Two ways to authenticate, and npm prefers the first: it detects an OIDC
      # environment and only falls back to a token. This checks that at least
      # one of them is available, because the alternative is discovering it
      # after the GitHub Release already exists.
      #
      # It cannot confirm that a trusted publisher is actually configured for
      # each package — npm exposes no way to ask — so OIDC being available is as
      # far as this goes.
      - name: Check the publish credential
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "OIDC is available; npm will attempt trusted publishing."
            exit 0
          fi
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error title=No way to authenticate to npm::Configure a trusted publisher for each @noetive/mcp-server* package on npmjs.com, or add an npm token with publish rights on the @noetive scope as the NPM_TOKEN repository secret."
            exit 1
          fi
          npm whoami || {
            echo "::error title=NPM_TOKEN is not valid::npm rejected the token. It is set but expired, revoked, or lacks publish rights on the @noetive scope."
            exit 1
          }

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: binaries
          path: dist/

      # Both before the stamp. The stamp is a no-op on a correctly prepared tag
      # — scripts/stamp-version.js writes package.json and the lockfile together
      # and the release commit already carries both — but ordering it after the
      # install keeps that true rather than depending on it.
      - run: npm ci --ignore-scripts
        working-directory: installer

      - run: npm run build
        working-directory: installer

      # Every package carries the same version as the git tag, and the wrapper
      # pins its platform packages to exactly its own version. A drifting pair
      # would have a wrapper resolving a binary built from different source.
      - name: Stamp versions
        run: node scripts/stamp-version.js "${{ needs.release.outputs.version }}"

      - name: Build platform packages
        run: node scripts/build-platform-packages.js "${{ needs.release.outputs.version }}"

      # --provenance is redundant under trusted publishing, which generates it
      # anyway, and load-bearing on the token fallback, which does not. Kept so
      # the two paths produce the same artefact.
      #
      # Platform packages first: the wrapper declares them as optionalDependencies,
      # and npm skips an optional dependency it cannot resolve without erroring.
      # A wrapper published ahead of them therefore installs cleanly and finds no
      # binary — and npm will not let that version be replaced.
      #
      # Already-published versions are skipped rather than retried: npm versions
      # are immutable, so a re-run after a partial publish has no other way
      # forward, and without this the whole job is unrepeatable.
      - name: Publish platform packages
        run: |
          handled=0
          for dir in dist/npm/*/; do
            name=$(node -p "require('./$dir/package.json').name")
            if npm view "$name@$VERSION" version --prefer-online >/dev/null 2>&1; then
              echo "$name@$VERSION is already published; skipping."
            else
              npm publish --provenance --access public --tag "$NPM_TAG" "$dir"
            fi
            handled=$((handled + 1))
          done
          if [ "$handled" -ne 5 ]; then
            echo "::error title=Wrong number of platform packages::Expected 5, found $handled in dist/npm/. The wrapper pins all five, so publishing it now would ship one that cannot resolve on some platform."
            exit 1
          fi
        env:
          VERSION: ${{ needs.release.outputs.version }}
          NPM_TAG: ${{ needs.release.outputs.npm_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The gate before the one irreversible step in this job. Publishing the
      # wrapper is what a user installs; if any platform package is missing when
      # it goes out, that version is broken on that platform for good.
      #
      # Retried because the registry is read-your-writes only eventually: a
      # package published seconds ago can still 404 from another edge.
      - name: Every platform package resolves
        run: |
          for dir in dist/npm/*/; do
            name=$(node -p "require('./$dir/package.json').name")
            found=''
            for _ in $(seq 1 10); do
              if npm view "$name@$VERSION" version --prefer-online >/dev/null 2>&1; then
                found=1
                break
              fi
              sleep 10
            done
            if [ -z "$found" ]; then
              echo "::error title=Platform package missing::$name@$VERSION is not on the registry. Refusing to publish the wrapper, which would install cleanly and then find no binary on that platform."
              exit 1
            fi
            echo "$name@$VERSION resolves."
          done
        env:
          VERSION: ${{ needs.release.outputs.version }}

      - name: Publish wrapper
        run: |
          if npm view "@noetive/mcp-server@$VERSION" version --prefer-online >/dev/null 2>&1; then
            echo "@noetive/mcp-server@$VERSION is already published; skipping."
            exit 0
          fi
          npm publish --provenance --access public --tag "$NPM_TAG"
        working-directory: installer
        env:
          VERSION: ${{ needs.release.outputs.version }}
          NPM_TAG: ${{ needs.release.outputs.npm_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # The second distribution channel: a hosted agent runtime runs the server in a
  # container beside the agent rather than beside a person's editor. Built from
  # source rather than from the release archives — the Dockerfile cross-compiles,
  # so one buildx invocation produces both architectures at full speed, and the
  # image stays buildable on its own.
  oci:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Pushing to ghcr.io, and signing what was pushed.
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # `latest` only for a final release: a candidate that claims it becomes
      # what `docker pull` hands someone who never asked for one.
      - id: tags
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          {
            echo "tags<<EOF"
            echo "ghcr.io/noetive/noetive-mcp:${VERSION}"
            case "$VERSION" in
            *-*) ;;
            *) echo "ghcr.io/noetive/noetive-mcp:latest" ;;
            esac
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # The index annotation is not a duplicate of the Dockerfile's LABEL. The
      # label lands on each per-architecture image's config; the MCP registry
      # resolves the multi-arch index, which inherits nothing from its children.
      # Without this, ownership validation fails with a missing-annotation error
      # against an image that visibly carries the label.
      #
      # provenance is off because buildx would otherwise add unknown/unknown
      # attestation entries to that same index, giving the registry's manifest
      # walk one more shape to get wrong. The provenance itself is not lost — the
      # step below records it in GitHub's attestation store instead of the index.
      - id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: VERSION=${{ needs.release.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          annotations: |
            index:io.modelcontextprotocol.server.name=io.noetive/mcp-server

      # By digest, not by tag: a tag is a mutable pointer, so signing it attests
      # to whatever it names later rather than to what was built here.
      - name: Sign the image
        run: cosign sign --yes "ghcr.io/noetive/noetive-mcp@${{ steps.push.outputs.digest }}"

      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ghcr.io/noetive/noetive-mcp
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false

  # One string comparison that proves goreleaser stamped the binary correctly,
  # the right binary landed in the right platform package, that package
  # published, and the wrapper resolved it. Gating the registry on this is the
  # point: an npm mistake is recoverable with a patch bump, a registry entry
  # advertising a broken version is not.
  smoke:
    needs: [release, npm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      # --ignore-scripts on purpose: it disables the postinstall download, so
      # this can only pass if the platform package for this host published and
      # the wrapper resolved it. With scripts enabled the fallback papers over a
      # missing package until a user hits it.
      #
      # --prefer-online on every registry read is what makes retrying mean
      # anything. npm caches the packument under ~/.npm/_cacache and, within its
      # freshness window, answers from that copy without revalidating. A lookup
      # made seconds after publish can therefore cache a document that does not
      # list the new version yet, and every later attempt re-reads that same
      # stale document from disk — the registry is fine and the host never asks
      # it again. 0.1.1 published at 22:15:12; smoke first asked at 22:15:20 and
      # all ten attempts over the next 2.4 minutes reported ETARGET for a
      # version the registry already had.
      #
      # Two waits, because the two failure modes need different evidence.
      - name: The published package installs and reports the released version
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          # First: does this host's edge serve the wrapper at all? Asked
          # separately so "not propagated yet" is never reported as a broken
          # binary, which is what the old single loop did.
          for _ in $(seq 1 20); do
            if npm view "@noetive/mcp-server@${VERSION}" version --prefer-online >/dev/null 2>&1; then
              served=1
              break
            fi
            echo "registry has not served ${VERSION} to this host yet; retrying" >&2
            sleep 15
          done
          if [ -z "${served:-}" ]; then
            echo "::error title=Wrapper never propagated::@noetive/mcp-server@${VERSION} did not resolve on this host within five minutes of publish, with cache revalidation forced." >&2
            exit 1
          fi

          # Then: install and assert together, still retried. npm treats
          # optionalDependencies as best-effort, so a platform package that has
          # not reached this edge yet leaves `npm install` exiting 0 with no
          # binary. Splitting these would let the install succeed once and then
          # fail the assertion permanently.
          for _ in $(seq 1 20); do
            if npm install -g "@noetive/mcp-server@${VERSION}" --ignore-scripts --prefer-online &&
              got=$(noetive-mcp --version 2>&1) &&
              [ "$got" = "$VERSION" ]; then
              echo "noetive-mcp --version reports ${got}"
              exit 0
            fi
            echo "wrapper resolves but no working binary yet (last saw '${got:-nothing}'); retrying" >&2
            got=''
            sleep 15
          done
          echo "::error title=No working binary::@noetive/mcp-server@${VERSION} resolved but never produced a runnable binary on this host." >&2
          exit 1

  # Last, because the registry validates every package server.json points at:
  # the npm package must exist and carry a matching mcpName, and the image must
  # exist and carry a matching io.modelcontextprotocol.server.name annotation.
  # Running before either publishes fails on an artifact that is not there yet.
  registry:
    needs: [release, smoke, oci]
    # Release tags only. npm and ghcr can both be superseded by the next version;
    # a registry entry cannot be unpublished, so a prerelease would leave
    # io.noetive/mcp-server advertising an RC as what it is. A prerelease still
    # exercises every stage before this one, which is where the failures are.
    if: ${{ !contains(needs.release.outputs.version, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # server.json is read out of this checkout, and the registry records
      # whatever it is handed — permanently, since an entry cannot be
      # unpublished. On a correctly prepared tag this restamp changes nothing,
      # because the release job already refused a tag disagreeing with
      # tools/manifest.yaml and packaging/emit's tests refuse a tree whose
      # version files disagree with each other. It runs anyway: it costs a
      # second, it needs no state from any other job, and it makes this the job
      # you can safely re-run on its own after a transient registry failure.
      - name: Stamp versions
        run: node scripts/stamp-version.js "${{ needs.release.outputs.version }}"

      # Pinned and checked against the checksum published with that release.
      # `latest/download/` hands the release path a binary nobody chose, while
      # MCP_REGISTRY_PRIVATE_KEY is in scope for whatever it turns out to be.
      # Bump the two constants together; a mismatch aborts.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: "1.8.1"
          MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
        run: |
          base="https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}"
          curl -fsSL -o mcp-publisher.tar.gz "${base}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher

      # This is the exact request the registry's npm validator makes, so the
      # release waits on the fact it depends on rather than on a guess. Separate
      # from the smoke job's retry: different consumer, different cache edge.
      - name: Wait for npm to serve the published version
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          url="https://registry.npmjs.org/@noetive%2Fmcp-server/${VERSION}"
          for _ in $(seq 1 30); do
            if [ "$(curl -fsSL "$url" | jq -r '.mcpName // empty')" = "io.noetive/mcp-server" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "npm did not serve @noetive/mcp-server@${VERSION} with mcpName io.noetive/mcp-server within five minutes" >&2
          exit 1

      # DNS auth, not github-oidc. The registry ties the auth method to the
      # namespace: GitHub auth only grants io.github.<user-or-org>/*, and this
      # server is io.noetive/mcp-server — the reverse-DNS form of a domain we
      # own. Proving that means signing a challenge with the ed25519 key whose
      # public half is published in noetive.io's apex TXT record, managed in
      # noetive-platform-infra as route53-apex-txt-io.tf.
      #
      # The key is passed through the environment rather than interpolated into
      # the run block, so it never appears in the rendered command line.
      - name: Publish to the MCP registry
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          if [ -z "$MCP_REGISTRY_PRIVATE_KEY" ]; then
            echo "MCP_REGISTRY_PRIVATE_KEY is not set; cannot prove ownership of noetive.io." >&2
            exit 1
          fi
          ./mcp-publisher login dns \
            --domain noetive.io \
            --private-key "$MCP_REGISTRY_PRIVATE_KEY"
          ./mcp-publisher publish
