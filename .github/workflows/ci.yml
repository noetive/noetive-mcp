name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A pull request's only interesting run is the one for its newest commit; the
# superseded ones spend runners answering a question nobody is asking. Pushes to
# main are never cancelled — the per-commit record of which commit was green is
# what makes a bisect possible.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Third-party actions are pinned to a commit, not a tag: a tag can be moved to
# point at different code after review, which is the shape every recent Actions
# supply-chain compromise has taken. Dependabot keeps the trailing comments and
# the pins in step.
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 ./...

      # goreleaser runs `go mod tidy` before it builds, so an untidy module here
      # means the released binary is built from a dependency set nothing tested.
      - name: Module is tidy
        run: go mod tidy -diff

      # Reachability-filtered, which is the whole reason it can be a gate rather
      # than a wall: it fires when a path in this code reaches the vulnerable
      # symbol, not when a vulnerable version appears somewhere in the graph.
      # The advisory database is fetched at run time, so pinning the scanner
      # costs no freshness — a red build here can arrive without a code change,
      # and that is the signal, not a defect.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      # No separate `go vet` step: govet is in golangci-lint's standard set and
      # .golangci.yml adds fieldalignment on top, so a vet step could only ever
      # produce a failure `make lint` does not reproduce.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.5.0
          args: --config ./.golangci.yml ./...

  # Split out because 30s per target is a third of the critical path and couples
  # to nothing else in the go job.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Enumerated, not listed: a hand-written list silently stops covering the
      # target somebody added last week, and a new tool argument is exactly when
      # fuzzing earns its keep. `make fuzz` enumerates the same way.
      #
      # Short by design — the point here is that the corpus still replays and no
      # seed panics. Campaigns run on a schedule.
      - name: Fuzz seeds
        run: |
          targets=$(go test -list '^Fuzz' ./internal/broker | grep '^Fuzz')
          test -n "$targets"
          for target in $targets; do
            go test -run "^$" -fuzz "^${target}$" -fuzztime 30s ./internal/broker
          done

  installer:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # The installer writes into per-user config paths that differ by platform,
      # so path handling is only actually covered by running on each.
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: installer/package-lock.json

      - run: npm ci --ignore-scripts
        working-directory: installer

      - run: npm test
        working-directory: installer

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # A hook committed without its executable bit is a hook git silently does
      # not run, on every machine, forever. The mode lives in the index; check it
      # there rather than on a checkout that may have been normalised.
      - name: Hooks are executable
        run: |
          # Asserted, not assumed: an empty or renamed .githooks/ would make the
          # mode check below pass by having nothing to look at.
          tracked=$(git ls-files -s .githooks/)
          test -n "$tracked" || { echo ".githooks/ tracks no files" >&2; exit 1; }
          bad=$(echo "$tracked" | grep -v '^100755 ' || true)
          if [ -n "$bad" ]; then
            echo "Not mode 755 in the index:" >&2
            echo "$bad" >&2
            exit 1
          fi

      # The emitted plugin payloads are generated from tools/manifest.yaml. This
      # fails when someone hand-edits a generated file, which is the failure mode
      # that lets the Claude plugin and the Kiro Power drift apart.
      - name: Regenerate packaging
        run: go run ./packaging/emit

      # No pathspec, and status rather than diff: the emitter also writes the
      # root skills/ directory, and adding a tool emits a *new* file that a diff
      # does not see at all. Any path the emitter learns to write is covered from
      # the day it learns to write it.
      - name: Check packaging is up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            exit 1
          fi

  # The output directory names are the one contract .goreleaser.yaml and the npm
  # packaging share, spelled out in two files and dependent on goreleaser's
  # GOAMD64 suffix convention. Catching a break at tag time means catching it
  # after a GitHub Release exists.
  release-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # --snapshot skips publishing but not the sign pipe, which needs the
      # release job's OIDC token; everything before it is what breaks silently.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.1
          args: release --snapshot --clean --skip=sign

      # Exits non-zero on the first binary it cannot find, so running it is the
      # assertion.
      - name: Platform packages resolve every built binary
        run: node scripts/build-platform-packages.js 0.0.0

  # Both architectures, because the release pushes both and only one of them is
  # the runner's own. The Dockerfile cross-compiles rather than emulating, so
  # linux/arm64 is a real compile here and a broken one fails at the same place
  # it would at tag time — after a GitHub Release exists.
  #
  # Not pushed: the load/push distinction is the only thing that differs from the
  # release build, and buildx cannot load a multi-arch result into the local
  # daemon anyway. The assertion is that it builds.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          annotations: |
            index:io.modelcontextprotocol.server.name=io.noetive/mcp-server
